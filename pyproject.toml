[project]
name = "cheatdetect"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "ipykernel>=7.2.0",
    "joblib>=1.5.3",
    "matplotlib>=3.10.9",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "uvicorn>=0.49.0",
]

# 1. ADD THIS: Tells uv and pip how to build your project
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.jupytext]
formats = "ipynb,py:percent"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    # Notebook tooling: jupytext keeps the .py twins in sync; nbconvert
    # provides the executor for `jupytext --execute`.
    "jupytext>=1.16",
    "nbconvert>=7.16",
    # Research-only dependency (LSTM autoencoder). Kept out of the API image
    # via the Dockerfile's `uv sync --no-dev`. CPU wheel to avoid CUDA bloat.
    "torch>=2.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
